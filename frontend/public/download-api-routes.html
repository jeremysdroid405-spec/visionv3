<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download API Routes</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: #1a1a1a;
            border-radius: 16px;
            border: 1px solid #333;
            max-width: 500px;
        }
        h1 { margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; }
        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat {
            padding: 12px 20px;
            background: #222;
            border-radius: 8px;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #22c55e;
        }
        .stat-label {
            font-size: 12px;
            color: #666;
        }
        .btn {
            display: inline-block;
            padding: 16px 32px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            border: none;
            margin: 10px;
        }
        .btn:hover {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
        }
        .btn.green {
            background: linear-gradient(135deg, #22c55e, #16a34a);
        }
        .btn.green:hover {
            background: linear-gradient(135deg, #16a34a, #15803d);
        }
        .info {
            margin-top: 20px;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>PropVision API Documentation</h1>
        <p class="subtitle">Complete list of all backend API routes</p>
        
        <div class="stats">
            <div class="stat">
                <div class="stat-value">270</div>
                <div class="stat-label">Total Routes</div>
            </div>
            <div class="stat">
                <div class="stat-value">170</div>
                <div class="stat-label">GET</div>
            </div>
            <div class="stat">
                <div class="stat-value">99</div>
                <div class="stat-label">POST</div>
            </div>
        </div>
        
        <button class="btn" onclick="downloadJSON()">Download JSON</button>
        <button class="btn green" onclick="downloadCSV()">Download CSV</button>
        
        <p class="info">Includes method, path, function name, and description for each route</p>
    </div>
    <script>
        async function downloadJSON() {
            try {
                const response = await fetch('/api_routes.json');
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'propvision_api_routes.json';
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                a.remove();
            } catch (error) {
                alert('Download failed: ' + error.message);
            }
        }
        
        async function downloadCSV() {
            try {
                const response = await fetch('/api_routes.json');
                const data = await response.json();
                
                // Convert to CSV
                let csv = 'Method,Path,Function,File,Description\n';
                for (const route of data.routes) {
                    const desc = route.description.replace(/"/g, '""');
                    csv += `${route.method},"${route.path}","${route.function}","${route.file}","${desc}"\n`;
                }
                
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'propvision_api_routes.csv';
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                a.remove();
            } catch (error) {
                alert('Download failed: ' + error.message);
            }
        }
    </script>
</body>
</html>
